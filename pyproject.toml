[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlx-research"
version = "0.1.0"
description = "Compute-light RL benchmark and autonomous scientific workflow"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "RLX Research contributors"}]
license = {text = "MIT"}
keywords = ["reinforcement-learning", "benchmark", "research-agents", "multi-objective", "long-horizon"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.23"]

[project.scripts]
rlx-lab = "rlx_lab.cli:main"
rlx-calibrate = "rlx_agents.cli:main"

[project.optional-dependencies]
torch = ["torch>=2.0"]
gymnasium = ["gymnasium>=0.29"]
dev = ["pytest>=7", "ruff>=0.5"]
all = ["torch>=2.0", "gymnasium>=0.29", "pytest>=7", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
