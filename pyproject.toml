[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlh-bench"
version = "0.2.0"
description = "Recoverable long-horizon sparse-feedback RL benchmark environments"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "RLH Bench contributors"}]
license = {text = "MIT"}
keywords = ["reinforcement-learning", "benchmark", "sparse-reward", "multi-objective", "long-horizon"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
gymnasium = ["gymnasium>=0.29"]
dev = ["pytest>=7", "ruff>=0.5"]
all = ["torch>=2.0", "gymnasium>=0.29", "pytest>=7", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
